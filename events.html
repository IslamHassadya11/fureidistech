<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="index.html" aria-label="FureidisTech home">
      <img class="logo-l" src="assets/logo_light.png" alt="FureidisTech logo">
      <img class="logo-d" src="assets/logo_dark.png" alt="FureidisTech logo">
    </a>
    <nav class="links" aria-label="Main">
      <a href="index.html" data-i18n="nav_home"></a>
      <a href="what-we-do.html" data-i18n="nav_what"></a>

      <a href="index.html#town" data-i18n="nav_town"></a>
      <a href="join.html" data-i18n="nav_join"></a>
    </nav>
    <div class="controls">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ar" aria-pressed="false">عربي</button>
        <button type="button" data-lang="he" aria-pressed="false">עברית</button>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
<main>
<section class="page-hero">
  <div class="wrap">
    <div class="kicker" data-i18n="ev_kicker"></div>
    <h1 data-i18n="ev_h2"></h1>
    <p class="lead" data-i18n="ev_p"></p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="grid2">
      <div class="card ev reveal tilt">
        <span class="tag" data-i18n="ev1_tag"></span>
        <h3 data-i18n="ev1_h"></h3>
        <p data-i18n="ev1_p"></p>
      </div>
      <div class="card ev reveal tilt">
        <span class="tag" data-i18n="ev2_tag"></span>
        <h3 data-i18n="ev2_h"></h3>
        <p data-i18n="ev2_p"></p>
      </div>
    </div>
  </div>
</section>

<section class="band">
  <div class="wrap">
    <div class="card ev-next reveal" style="text-align:center;padding:clamp(32px,5vw,52px)">
      <span class="tag" style="display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px" data-i18n="ev_next_tag"></span>
      <h2 data-i18n="ev_next_h"></h2>
      <p style="color:var(--ink-soft);max-width:34rem;margin:0 auto 26px" data-i18n="ev_next_p"></p>
      <div class="cta-row" style="justify-content:center">
        <a class="btn btn-primary" href="https://www.facebook.com/FureidisTech" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.25-1.5 1.55-1.5h1.65V3.6c-.29-.04-1.27-.12-2.42-.12-2.4 0-4.03 1.46-4.03 4.15v2.26H7.5V13h2.74v8h3.26Z"/></svg><span data-i18n="ev_next_cta"></span></a>
        <a class="btn btn-ghost" href="join.html" data-i18n="join_cta1"></a>
      </div>
    </div>
  </div>
</section>
</main>
<footer>
  <div class="wrap">
    <a href="index.html" aria-label="FureidisTech home">
      <img class="logo-l" src="assets/logo_light.png" alt="FureidisTech">
