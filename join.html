<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join — FureidisTech</title>
<meta name="description" content="FureidisTech: a tech innovation hub bringing together young talent, students and academics from Fureidis.">
<link rel="icon" type="image/png" href="assets/logo_light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="index.html" aria-label="FureidisTech home">
      <img class="logo-l" src="assets/logo_light.png" alt="FureidisTech logo">
      <img class="logo-d" src="assets/logo_dark.png" alt="FureidisTech logo">
    </a>
    <nav class="links" aria-label="Main">
      <a href="index.html" data-i18n="nav_home"></a>
      <a href="what-we-do.html" data-i18n="nav_what"></a>
      <a href="events.html" data-i18n="nav_events"></a>
      <a href="index.html#town" data-i18n="nav_town"></a>
      <a href="join.html" class="active" data-i18n="nav_join"></a>
    </nav>
    <div class="controls">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ar" aria-pressed="false">عربي</button>
        <button type="button" data-lang="he" aria-pressed="false">עברית</button>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
<main>
<section class="page-hero">
  <div class="wrap">
    <div class="kicker" data-i18n="join_kicker"></div>
    <h1><span data-i18n="jo_h1a"></span> <span class="hl" data-i18n="jo_h1b"></span></h1>
    <p class="lead" data-i18n="jo_lead"></p>
  </div>
</section>

<section>
  <div class="wrap">
    <!-- ▼▼▼ IMPORTANT: replace YOUR_FORM_ID with your free Formspree form ID (see README) ▼▼▼ -->
    <form id="joinForm" class="form-grid" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="field">
        <label for="f-name" data-i18n="f_name"></label>
        <input id="f-name" name="name" type="text" required autocomplete="name">
      </div>
      <div class="field">
        <label for="f-email" data-i18n="f_email"></label>
        <input id="f-email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="f-phone" data-i18n="f_phone"></label>
        <input id="f-phone" name="phone" type="tel" autocomplete="tel">
      </div>
      <div class="field">
        <label for="f-iam" data-i18n="f_iam"></label>
        <select id="f-iam" name="i_am" required>
          <option value="" data-i18n="f_iam0"></option>
          <option value="pupil" data-i18n="f_iam1"></option>
          <option value="student" data-i18n="f_iam2"></option>
          <option value="graduate" data-i18n="f_iam3"></option>
          <option value="professional" data-i18n="f_iam4"></option>
          <option value="other" data-i18n="f_iam5"></option>
        </select>
      </div>
      <div class="field full">
        <label for="f-msg" data-i18n="f_msg"></label>
        <textarea id="f-msg" name="message" data-i18n-ph="f_msg_ph"></textarea>
      </div>
      <div class="full">
        <button class="btn btn-primary" type="submit" data-i18n="f_send"></button>
        <p class="form-note" data-i18n="f_note"></p>
        <div id="formMsg" class="form-msg" role="status"></div>
      </div>
    </form>

    <p style="margin-top:36px;color:var(--ink-soft);font-size:.92rem">
      <span data-i18n="f_alt"></span>
      <a href="https://m.me/FureidisTech" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;text-decoration:none">m.me/FureidisTech</a>
    </p>
  </div>
</section>
</main>
<footer>
  <div class="wrap">
    <a href="index.html" aria-label="FureidisTech home">
      <img class="logo-l" src="assets/logo_light.png" alt="FureidisTech">
      <img class="logo-d" src="assets/logo_dark.png" alt="FureidisTech">
    </a>
    <span data-i18n="foot_line"></span>
    <a href="https://www.facebook.com/FureidisTech" target="_blank" rel="noopener">facebook.com/FureidisTech</a>
  </div>
</footer>
<script src="assets/app.js"></script>
</body>
</html>
